<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<th:block th:replace="~{fragments/head.html :: header}"> </th:block>
<body>
<div th:replace="~{fragments/admin-navigation.html :: navbar}"></div>

<form th:action="@{/admin/create-teamDetails}" method="post"
    style="width: 50%; margin: 3% auto;" >
  <div class="form-group">
    <label for="imageInput">Image link</label>
    <input type="text" name="image-link" class="form-control  mt-2" id="imageInput" aria-describedby="emailHelp" placeholder="Paste image link here">
  </div>
  <div class="form-group mt-3">
    <label for="teamName">Team Name</label>
    <input type="text" name="team-name" class="form-control mt-2" id="teamName" placeholder="Input team name here">
    <div class="alert alert-danger" role="alert" th:if="${!errorMessage.isEmpty()}" th:text="${errorMessage}"></div>
  </div>
  <div class="form-group mt-3">
    <label for="teamDescription">Team description</label>
    <textarea name="team-description" class="form-control mt-2" id="teamDescription" rows="3"></textarea>
  </div>
  <button type="submit" class="btn btn-primary mt-4">Submit</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
