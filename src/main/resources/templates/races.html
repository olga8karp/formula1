<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<th:block th:replace="~{fragments/head.html :: header}"></th:block>
<body>
<div th:replace="~{fragments/navigation.html :: navbar}"></div>
<div class="container mt-5">
  <h2>Driver Ranking</h2>
  <div class="d-inline-flex p-2 mt-3 mb-3" th:each="season : ${seasons}">
    <a th:href="@{/driver/rankings/{season}(season=${season})}" th:text="${season}"></a>
  </div>
  <table class="table table-striped">
    <thead>
    <tr>
      <th>Id</th>
      <th>Competition</th>
      <th>Location</th>
      <th>Circuit</th>
      <th>Date</th>
      <th>Year</th>
      <th>Distance</th>
      <th>Total Laps</th>
      <th>Fastest Lap Time</th>
      <th>Fastest Lap Driver</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="race : ${races}">
      <td th:text="${race.id}"></td>
      <td th:text="${race.competition.name}"></td>
      <td th:text="${race.competition.location.city + ', ' + race.competition.location.country}"></td>
      <td>
        <a th:href="@{/circuits/{id}(id=${race.circuit.id})}" th:text="${race.circuit.name}" target="_blank"></a>
      </td>
      <td th:text="${race.date}"></td>
      <td th:text="${race.season}"></td>
      <td th:text="${race.distance}"></td>
      <td th:text="${race.laps.totalLaps}"></td>
      <td th:text="${race.fastestLap.time}"></td>
      <td th:text="${race.fastestLap.driver.driverId}"></td>
    </tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
